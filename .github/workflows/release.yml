name: Release

# Tag-only: the version check compares the tag to __version__, which a branch never matches.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release and attach the wheel

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned because this is the one job that can write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          pip install "build>=1,<2"
          python -m build

      # Before anything uploads. twine 6.1 and 6.2 reject the Metadata-Version 2.5 hatchling writes.
      - name: Check the packages and their PyPI page
        run: |
          pip install "twine>=7,<8"
          twine check dist/*

      # Refuse a tag that disagrees with the package rather than publish a mislabelled wheel.
      - name: Check the tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP '__version__ = "\K[^"]+' src/gatle_ignite/__init__.py)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $TAG != __version__ $VERSION"
            exit 1
          fi
          echo "tag and __version__ agree: $VERSION"

      # PyPI gets exactly the files built and checked here.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

      # The preinstalled gh with this job's token, so no third-party action runs where it can write.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            git log -1 --format=%b
            echo
            echo '```bash'
            echo "pip install gatle-ignite==$VERSION"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --notes-file "$RUNNER_TEMP/notes.md"

  # Forks skip the upload: PyPI trusts only this repository's release.yml.
  pypi:
    needs: [release]
    if: github.repository == 'ryanwongsa/gatle-ignite'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
